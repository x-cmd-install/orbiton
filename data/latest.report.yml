},{"id":743540180,"node_id":"RA_kwDODKFpt84sUYXU","name":"orbiton-2.75.0-openbsd_x86_64_static.tar.gz","label":null,"uploader":{"login":"xyproto","id":52813,"node_id":"MDQ6VXNlcjUyODEz","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":6967009,"digest":"sha256:9f3d7f61c923986f54ba7b039be8bcb79c7f9583669f6b7acc3ea0401f535faa","download_count":3,"created_at":"2026-11-13T12:15:29Z","updated_at":"2026-11-13T12:15:30Z"},{"id":743540233,"node_id":"RA_kwDODKFpt84sUYYJ","name":"orbiton-2.75.0-windows_aarch64_static.zip","label":null,"uploader":{"login":"xyproto","id":52813,"node_id":"MDQ6VXNlcjUyODEz","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":6411414,"digest":"sha256:5b2511e636b531e3f92134b4c90a926bfae512c85e12834d9436b1cabf7ea068","download_count":3,"created_at":"2026-11-13T12:15:30Z","updated_at":"2026-11-13T12:15:31Z"},{"id":743540017,"node_id":"RA_kwDODKFpt84sUYUx","name":"orbiton-2.75.0-windows_x86_64_static.zip","label":null,"uploader":{"login":"xyproto","id":52813,"node_id":"MDQ6VXNlcjUyODEz","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":7133206,"digest":"sha256:d954e773cd2bce62ca223d919ea56e2477ea0413fa50019c8de0b03a0fc49bee","download_count":5,"created_at":"2026-11-13T12:15:25Z","updated_at":"2026-11-13T12:15:26Z"}],"body":"### Retro game development\r\n\r\n* Add experimental support for building+running C64, CHIP-8, DOS, GBA, NES and SNES programs.\r\n* Add initial support for LÖVE and pyxel.\r\n\r\n### Fixes\r\n\r\n* Fix an issue with globbing when searching for files.\r\n* Fix syntax highlighting for light backgrounds (like the default `xterm` theme).\r\n* Hide quick help when \"nano mode\" is enabled.\r\n\r\n### Book mode\r\n\r\n* Add an experimental book mode browser preview feature.\r\n* Improve how '<!--- comments --->' in Markdown are handled.\r\n\r\n### Performance\r\n\r\n* Add sixel performance detection.\r\n* Improve how the \"search when typing\" feature works, especially for larger files.\r\n\r\n### Look and feel\r\n\r\n* Adjust the placement of the program output box.\r\n* Improve the LSP / Tab completion behavior.\r\n* Adjust hotkeys for jumping to matching brackets.\r\n\r\n### Various\r\n\r\n* Add a termindex badge to the README.md file.\r\n* Try to play `.abc` files with fluidsynth before trying timidity.\r\n* Add initial support for Fish and Oil shell scripts.\r\n* Update documentation.\r\n* Update dependencies.\r\n\r\n"}
